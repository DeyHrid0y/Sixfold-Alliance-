<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1d2a26;--mu:#64706b;--ac:#0f6b57;--ac2:#c8932b;--bd:#e4ded0;--nav:#0f3d33;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101815;--card:#18231f;--tx:#e8efe9;--mu:#9aa9a2;--ac:#3fc4a0;--ac2:#e0b252;--bd:#2a3a34;--nav:#0a1411}}
:root[data-theme="dark"]{--bg:#101815;--card:#18231f;--tx:#e8efe9;--mu:#9aa9a2;--ac:#3fc4a0;--ac2:#e0b252;--bd:#2a3a34;--nav:#0a1411}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
header{background:var(--nav);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
.bar{max-width:1000px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.5px;color:#fff;text-decoration:none;font-size:18px}.logo span{color:var(--ac2)}
nav{display:none;position:absolute;right:16px;top:100%;flex-direction:column;gap:2px;min-width:210px;background:var(--nav);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:20}nav.open{display:flex}nav a{color:#cfe0d9;text-decoration:none;padding:10px 14px;border-radius:8px;font-size:16px}
nav a.on,nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;text-decoration:none;display:inline-block}
.btn.o{background:transparent;border:1.5px solid currentColor}.btn.s{padding:5px 12px;font-size:13px}
.btn.g{background:var(--ac2);color:#241a05}
main{max-width:1000px;margin:auto;padding:20px 16px 50px}
.view{display:none}.view.on{display:block}
.hero{background:linear-gradient(135deg,var(--nav),#17614f);color:#fff;border-radius:18px;padding:48px 22px;text-align:center}
.hero h1{margin:0;font-size:clamp(30px,7vw,52px);letter-spacing:1px}.hero p{margin:8px 0}.hero .tag{color:var(--ac2);font-size:19px;font-weight:600}
.hero .acts{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:18px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat{text-align:center}.stat b{display:block;font-size:28px;color:var(--ac)}.stat small,.mu{color:var(--mu)}
h2{margin:26px 0 10px;font-size:24px}h2::after{content:"";display:block;width:44px;height:3px;background:var(--ac2);margin-top:4px;border-radius:2px}
.av{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;margin:0 auto 8px}
.mem{text-align:center}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-size:14px;color:var(--mu)}.narrow{max-width:400px;margin:20px auto}
.note{background:rgba(200,147,43,.15);border-left:4px solid var(--ac2);padding:10px 12px;border-radius:8px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.pill{color:var(--ac);font-weight:600}
.rph{display:none}
.late{color:#d9534f;font-weight:700}
@media print{.tsrch{display:none!important}.rph{display:block!important}header,.tabs,.btn,footer,select,label{display:none!important}body{background:#fff;color:#000}body::before{display:none}.card{border:0}}
footer{text-align:center;color:var(--mu);font-size:13px;padding:20px}
ul.cl li{margin:6px 0}
</style>

<a class="logo" href="#home">SIXFOLD <span>ALLIANCE</span></a>

</section>

<section class="view" id="v-about">
<h2 data-i="nAbout"></h2>
<div class="card"><h3 data-i="mission"></h3><p data-i="missionT"></p></div><br>
<div class="card"><h3 data-i="vision"></h3><p data-i="visionT"></p></div><br>
<div class="card"><h3 data-i="obj"></h3><ul class="cl"><li data-i="o1"></li><li data-i="o2"></li><li data-i="o3"></li></ul></div>
</section>


<section class="view" id="v-activities">
<h2 data-i="nAct"></h2>
<div class="grid">
<div class="card"><h3 data-i="a1"></h3><p class="mu" data-i="a1t"></p></div>
<div class="card"><h3 data-i="a2"></h3><p class="mu" data-i="a2t"></p></div>
<div class="card"><h3 data-i="a3"></h3><p class="mu" data-i="a3t"></p></div>
</div>
</section>


<section class="view" id="v-constitution">
<h2 data-i="nCons"></h2>
<div class="card"><h3 data-i="rules"></h3>
<div class="wrap"><table><tr><th data-i="dec"></th><th data-i="req"></th></tr>
<tr><td data-i="d1"></td><td>৫ / ৬</td></tr>
<tr><td data-i="d2"></td><td>৬ / ৬</td></tr>
<tr><td data-i="d3"></td><td>৬ / ৬</td></tr>
<tr><td data-i="d4"></td><td>৬ / ৬</td></tr>
<tr><td data-i="d5"></td><td>৪ / ৫</td></tr></table></div></div>
</section>

<section class="view" id="v-contact">
<h2 data-i="nCont"></h2>
<div class="card narrow" id="cdet" style="margin-top:0"></div>
</section>

<section class="view" id="v-login">
<div class="tabs" style="justify-content:center"><button class="btn s" id="tL" data-i="login"></button><button class="btn o s" id="tA" style="color:var(--ac)" data-i="apply"></button></div>
<div class="card narrow" id="cLogin"><h2 data-i="login" style="margin-top:0"></h2>
<label data-i="em"></label><input id="le" type="email" placeholder="member@example.com">
<label data-i="pass"></label><input id="lp" type="password">
<button class="btn" id="go" style="width:100%" data-i="login"></button>
<p class="pill" id="lerr"></p><p><a href="#login" id="fp" data-i="forgot"></a></p>
</div>
<div class="card narrow" id="cApply" style="display:none"><h2 data-i="apply" style="margin-top:0"></h2>
<label data-i="fn"></label><input id="ap_fn" maxlength="60" autocomplete="given-name">
<label data-i="ln"></label><input id="ap_ln" maxlength="60" autocomplete="family-name">
<label data-i="fa"></label><input id="ap_fa" maxlength="60">
<label data-i="mo"></label><input id="ap_mo" maxlength="60">
<label data-i="vi"></label><input id="ap_vi" maxlength="80">
<label data-i="ph"></label><input id="ap_ph" type="tel" maxlength="20" placeholder="01XXXXXXXXX" autocomplete="tel">
<label data-i="em"></label><input id="ap_em" type="email" maxlength="120" autocomplete="email">
<label data-i="bk"></label><input id="ap_bk" type="tel" maxlength="20" placeholder="01XXXXXXXXX">
<div style="position:absolute;left:-9999px" aria-hidden="true"><input id="ap_hp" tabindex="-1" autocomplete="off"></div>
<button class="btn" id="apgo" style="width:100%" data-i="submitApp"></button>
<p class="pill" id="apmsg"></p><p class="note" data-i="apNote"></p></div>
</section>

<section class="view" id="v-portal"></section>
<section class="view" id="v-admin"></section>

</main>

if(!cfg.apiKey.startsWith("YOUR")){
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
SA.mode="firebase";SA.ready=false;
["about","activities","constitution","contact"].forEach(id=>getDoc(doc(db,"pages/"+id)).then(x=>{if(x.exists()){PG[id]=x.data();if(window.applyPages)applyPages()}}).catch(()=>{}));

const D=p=>doc(db,p),ts=()=>serverTimestamp(),need=(c,m)=>{if(!c)throw new Error(m)};
const gd=async p=>{try{return await getDoc(D(p))}catch(e){return{exists:()=>false,data:()=>null}}};
const me=()=>SA.user,uid=()=>auth.currentUser.uid,staff=()=>need(me()&&me().staff,"Staff only"),adm=()=>need(me()&&me().role==="admin","Admin only");
const COL={monthly:"contributions",joining:"joiningFees"},FEE={monthly:100,joining:500},FLD={income:"totalIncome",expense:"totalExpense",loan:"totalLoanOut",donation:"totalDonation",repay:"totalRepaid"};
const KINDS=["general","support","member","amendment","dissolution"],UN=["amendment","member","dissolution"],NEED={general:5,support:4},FOUNDERS=6;
const sp=a=>{const p=Math.floor(a*80/100);return{p:p,c:a-p}};
const rows0=(c,w)=>getDocs(w?query(collection(db,c),where(w[0],w[1],w[2])):collection(db,c)).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
function resolve(k,y,n,e){if(UN.includes(k))return n>0?"rejected":y>=e?"approved":"open";const nd=Math.min(NEED[k],e);return (y>=nd&&(k!=="support"||y+n>=Math.min(5,e)))?"approved":n>e-nd?"rejected":"open"}
// ভোটের ফল সবসময় ভোট থেকে হিসাব হয় (৬ প্রতিষ্ঠাতা ধরে; সহায়তায় সংশ্লিষ্ট সদস্য বাদে ৫)
async function enrich(rs){return Promise.all(rs.map(async p=>{const vs=await getDocs(collection(db,"proposals/"+p.id+"/votes")),votes={};vs.forEach(v=>{votes[v.id]=v.data().vote});const a=Object.values(votes),y=a.filter(v=>v==="yes").length,n=a.length-y,el=FOUNDERS-(p.kind==="support"?1:0);return{...p,votes,yesCount:y,noCount:n,eligible:el,status:resolve(p.kind,y,n,el)}}))}
SA.rows=async(c,w)=>{
 if(c==="proposals")return enrich(await rows0(c,w));
 if(c==="decisions")return(await SA.rows("proposals")).filter(p=>p.status!=="open").map(p=>({id:p.id,title:p.title,result:p.status,yes:p.yesCount,no:p.noCount,createdAt:p.createdAt}));
 if(c==="applications"){const a=await rows0(c,w);if(!a.some(x=>x.status==="voting"))return a;const pr=await SA.rows("proposals");return a.map(x=>{if(x.status!=="voting")return x;const p=pr.find(q=>q.id===x.proposalId);return{...x,status:p&&p.status!=="open"?p.status:"voting"}})}
 return rows0(c,w)};
SA.doc=async p=>{const s=await gd(p);return s.exists()?s.data():null};
function post(b,m,p,c,kind){if(p!==0&&m!=="ORG")b.set(D("personalAccounts/"+m),{memberId:m,totalDeposit:increment(p),currentBalance:increment(p),updatedAt:ts()},{merge:true});
 b.set(D("commonFund/main"),{fundId:"main",[FLD[kind]]:increment(kind==="income"?c:Math.abs(c)),currentBalance:increment(c),updatedAt:ts()},{merge:true})}
const aud=(b,a,t,p,n,r)=>b.set(doc(collection(db,"auditLogs")),{action:a,performedBy:uid(),targetId:t||"",previousValue:p||"",newValue:n||"",reason:r||"",createdAt:ts()});
const notice=(b,t,body)=>b.set(doc(collection(db,"notifications")),{title:t,body:body||"",createdAt:ts()});
const tx=(b,id,o)=>b.set(D("transactions/"+id),{transactionId:id,status:"verified",createdBy:uid(),createdAt:ts(),...o});
const H={};
H.submitPayment=async d=>{const m=me().memberId,ref=String(d.reference||"").trim().toUpperCase();
 need(FEE[d.type],"Bad type");need(/^[A-Z0-9]{6,30}$/.test(ref),"Reference must be 6-30 letters/digits");
 if(d.type==="monthly")need(/^\d{4}-(0[1-9]|1[0-2])$/.test(d.month||""),"Bad month");
 const id=d.type==="monthly"?"CON-"+m+"-"+d.month:"JOIN-"+m,pp=COL[d.type]+"/"+id,old=await gd(pp),b=writeBatch(db);
 if(old.exists()){need(["rejected","reversed"].includes(old.data().status),"Already submitted");b.update(D(pp),{reference:ref,status:"pending",attempt:old.data().attempt+1,createdAt:ts()})}
 else b.set(D(pp),{id,memberId:m,type:d.type,...(d.type==="monthly"?{month:d.month}:{}),amount:FEE[d.type],reference:ref,status:"pending",attempt:1,submittedBy:uid(),createdAt:ts()});
 b.set(D("paymentRefs/"+ref),{memberId:m,createdAt:ts()});
 try{await b.commit()}catch(e){throw new Error(e.code==="permission-denied"?"Already submitted, or this reference was already used":e.message)}return{id}};
H.verifyPayment=async d=>{staff();const s=await gd(COL[d.type]+"/"+d.paymentId);need(s.exists(),"Not found");const p=s.data();
 need(p.status==="pending","Not pending");need(p.memberId!==me().memberId,"You cannot verify your own payment");
 const x=sp(p.amount),tid="TRX-"+d.paymentId+"-"+p.reference,b=writeBatch(db);
 b.update(D(COL[d.type]+"/"+d.paymentId),{status:"verified",verifiedBy:uid(),verifiedAt:ts()});
 tx(b,tid,{memberId:p.memberId,type:d.type==="monthly"?"contribution":"joiningFee",amount:p.amount,personalShare:x.p,commonShare:x.c,paymentId:d.paymentId,paymentType:d.type,description:d.type==="monthly"?p.month+" monthly contribution":"Joining fee"});
 post(b,p.memberId,x.p,x.c,"income");aud(b,"PAYMENT_VERIFIED",tid,"pending","verified");await b.commit();return{ok:true}};
H.rejectPayment=async d=>{staff();const pp=COL[d.type]+"/"+d.paymentId,s=await gd(pp);need(s.exists()&&s.data().status==="pending","Not pending");need(s.data().memberId!==me().memberId,"You cannot reject your own payment");
 const b=writeBatch(db);b.update(D(pp),{status:"rejected",rejectedBy:uid()});b.delete(D("paymentRefs/"+s.data().reference));aud(b,"PAYMENT_REJECTED",d.paymentId,"pending","rejected");await b.commit();return{ok:true}};
H.reversePayment=async d=>{adm();const reason=String(d.reason||"").trim().slice(0,300);need(d.transactionId&&reason.length>=3,"Transaction and reason required");
 const o=await gd("transactions/"+d.transactionId);need(o.exists()&&["contribution","joiningFee"].includes(o.data().type),"Cannot reverse this entry");const t=o.data();
 need(!(await gd("transactions/REV-"+d.transactionId)).exists(),"Already reversed");const b=writeBatch(db),rid="REV-"+d.transactionId;
 tx(b,rid,{memberId:t.memberId,type:"reversal",amount:-t.amount,personalShare:-t.personalShare,commonShare:-t.commonShare,reverses:d.transactionId,paymentId:t.paymentId,paymentType:t.paymentType,description:"Reversal: "+reason});
 post(b,t.memberId,-t.personalShare,-t.commonShare,"income");b.update(D(COL[t.paymentType]+"/"+t.paymentId),{status:"reversed"});
 aud(b,"TRANSACTION_REVERSED",d.transactionId,"verified","reversed",reason);
 try{await b.commit()}catch(e){throw new Error(e.code==="permission-denied"?"Not allowed (you cannot reverse your own payment)":e.message)}return{ok:true}};
H.reconcile=async()=>{staff();const[t,a,f]=await Promise.all([getDocs(collection(db,"transactions")),getDocs(collection(db,"personalAccounts")),gd("commonFund/main")]);
 const per={};let common=0;t.forEach(d=>{const x=d.data();per[x.memberId]=(per[x.memberId]||0)+x.personalShare;common+=x.commonShare});
 const have={};a.forEach(d=>{have[d.id]=d.data().currentBalance||0});const mm=[];
 new Set([...Object.keys(per),...Object.keys(have)]).forEach(k=>{if((per[k]||0)!==(have[k]||0))mm.push({memberId:k,ledger:per[k]||0,stored:have[k]||0})});
 const sc=f.exists()?f.data().currentBalance||0:0;if(common!==sc)mm.push({fund:"common",ledger:common,stored:sc});
 return{ok:!mm.length,checked:t.size,mismatches:mm}};
H.recordExpense=async d=>{staff();const amt=d.amount,cat=String(d.category||"").trim(),rs=String(d.reason||"").trim();
 need(Number.isInteger(amt)&&amt>0&&amt<=1e7,"Bad amount");need(cat.length>=2&&cat.length<=30,"Bad category");need(rs.length>=3&&rs.length<=300,"Bad reason");need(/^\d{4}-\d{2}-\d{2}$/.test(d.date||""),"Bad date");
 const f=await gd("commonFund/main");need((f.exists()?f.data().currentBalance||0:0)>=amt,"Not enough common fund");
 const ref=doc(collection(db,"expenses")),b=writeBatch(db);
 b.set(ref,{id:ref.id,category:cat,reason:rs,amount:amt,date:d.date,evidence:String(d.evidence||"").slice(0,100),recordedBy:uid(),createdAt:ts()});
 tx(b,"TRX-EXP-"+ref.id,{memberId:"ORG",type:"expense",amount:-amt,personalShare:0,commonShare:-amt,description:cat+": "+rs});
 post(b,"ORG",0,-amt,"expense");aud(b,"EXPENSE_RECORDED",ref.id,"",String(amt),rs);await b.commit();return{id:ref.id}};
H.createProposal=async d=>{const m=me().memberId;need(KINDS.includes(d.kind),"Bad kind");const ref=doc(collection(db,"proposals")),x={id:ref.id,kind:d.kind,createdBy:m,createdAt:ts()};
 if(d.kind==="support"){need(["loan","donation"].includes(d.supportType),"Bad support type");need(Number.isInteger(d.amount)&&d.amount>0&&d.amount<=1e7,"Bad amount");const pu=String(d.purpose||"").trim();need(pu.length>=3,"Purpose required");
  Object.assign(x,{title:"Support request ("+d.supportType+")",subjectMemberId:m,supportType:d.supportType,amount:d.amount,purpose:pu.slice(0,300)})}
 else{const t=String(d.title||"").trim();need(t.length>=3,"Title required");x.title=t.slice(0,200)}
 await setDoc(ref,x);return{id:ref.id}};
H.castVote=async d=>{need(["yes","no"].includes(d.vote),"Bad vote");
 try{await setDoc(D("proposals/"+d.proposalId+"/votes/"+me().memberId),{vote:d.vote,createdAt:ts()})}catch(e){throw new Error("Already voted, or you cannot vote on this")}return{ok:true}};
H.requestTransfer=async d=>{const from=me().memberId,to=String(d.to||""),amt=d.amount,note=String(d.note||"").trim().slice(0,200);
 need(/^SA-\d{3}$/.test(from),"Not a member account");need(/^SA-\d{3}$/.test(to)&&to!==from,"Choose another member");need(Number.isInteger(amt)&&amt>=1&&amt<=1000000,"Bad amount");
 const ms=await gd("members/"+to);need(ms.exists()&&ms.data().status==="active","Receiver not found or inactive");
 const pa=await gd("personalAccounts/"+from),bal=pa.exists()?pa.data().currentBalance||0:0;need(amt*2<=bal,"At most 50% of the balance can be transferred (max "+Math.floor(bal/2)+")");
 const id="TRF-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6).toUpperCase(),b=writeBatch(db);
 b.set(D("transfers/"+id),{id,fromMemberId:from,toMemberId:to,amount:amt,note,status:"pending",createdBy:uid(),createdAt:ts()});
 tx(b,"TRX-OUT-"+id,{memberId:from,type:"transferOut",amount:-amt,personalShare:-amt,commonShare:0,paymentId:id,paymentType:"transfer",description:("Transfer to "+to+(note?": "+note:"")).slice(0,400)});
 b.update(D("personalAccounts/"+from),{currentBalance:increment(-amt),lastXfer:id,updatedAt:ts()});
 try{await b.commit()}catch(e){throw new Error(e.code==="permission-denied"?"Not allowed (Firestore rules — deploy the new rules)":e.message)}return{ok:true,id}};
H.reviewTransfer=async d=>{adm();const ts0=await gd("transfers/"+d.id);need(ts0.exists(),"Transfer not found");const x=ts0.data();need(x.status==="pending","Already reviewed");
 const b=writeBatch(db),ok=!!d.approve,reason=String(d.reason||"").trim().slice(0,300);
 b.update(D("transfers/"+d.id),{status:ok?"approved":"rejected",reviewedBy:uid(),reviewedAt:ts()});
 if(ok){tx(b,"TRF-IN-"+d.id,{memberId:x.toMemberId,type:"transferIn",amount:x.amount,personalShare:x.amount,commonShare:0,paymentId:d.id,paymentType:"transfer",description:"Transfer from "+x.fromMemberId});
  b.set(D("personalAccounts/"+x.toMemberId),{memberId:x.toMemberId,totalDeposit:increment(0),currentBalance:increment(x.amount),updatedAt:ts()},{merge:true})}
 else{need(reason.length>=3,"Reason required");tx(b,"TRF-REF-"+d.id,{memberId:x.fromMemberId,type:"transferRefund",amount:x.amount,personalShare:x.amount,commonShare:0,paymentId:d.id,paymentType:"transfer",description:"Transfer rejected, refunded: "+reason});
  b.set(D("personalAccounts/"+x.fromMemberId),{memberId:x.fromMemberId,totalDeposit:increment(0),currentBalance:increment(x.amount),updatedAt:ts()},{merge:true})}
 aud(b,ok?"TRANSFER_APPROVED":"TRANSFER_REJECTED",d.id,x.fromMemberId+"→"+x.toMemberId,String(x.amount),reason);
 try{await b.commit()}catch(e){throw new Error(e.code==="permission-denied"?"Not allowed (Firestore rules — deploy the new rules)":e.message)}return{ok:true}};
H.saveReminderLog=async d=>{adm();const b=writeBatch(db);b.set(D("settings/reminders"),{date:String(d.date),month:String(d.month),sent:d.sent|0,failed:d.failed|0},{merge:true});await b.commit();return{ok:true}};
H.setReminderEnabled=async d=>{adm();const b=writeBatch(db);b.set(D("settings/reminders"),{enabled:!!d.enabled},{merge:true});await b.commit();return{ok:true}};
H.withdrawBalance=async d=>{adm();const id=String(d.id||""),amt=d.amount,reason=String(d.reason||"").trim().slice(0,300);need(/^SA-\d{3}$/.test(id),"Bad member id");need(id!==me().memberId,"You cannot record your own pay-out");
 need(Number.isInteger(amt)&&amt>0,"Bad amount");need(reason.length>=3,"Reason required");
 const pa=await gd("personalAccounts/"+id),bal=pa.exists()?pa.data().currentBalance||0:0;need(amt<=bal,"Amount is more than the personal balance ("+bal+")");
 const b=writeBatch(db),tid="WDR-"+id+"-"+Date.now();
 tx(b,tid,{memberId:id,type:"withdrawal",amount:-amt,personalShare:-amt,commonShare:0,description:"Withdrawal: "+reason});
 b.set(D("personalAccounts/"+id),{memberId:id,currentBalance:increment(-amt),updatedAt:ts()},{merge:true});
 aud(b,"BALANCE_WITHDRAWN",id,String(bal),String(bal-amt),reason);
 try{await b.commit()}catch(e){throw new Error(e.code==="permission-denied"?"Not allowed (Firestore rules — deploy the new rules)":e.message)}return{ok:true}};
H.savePage=async d=>{adm();need(["about","activities","constitution","contact"].includes(d.id),"Bad page");
 const bn=String(d.bn||"").slice(0,20000),en=String(d.en||"").slice(0,20000),pdf=String(d.pdf||"").trim();need(pdf===""||/^https:\/\/\S{3,480}$/.test(pdf),"PDF link must start with https://");
 const b=writeBatch(db);b.set(D("pages/"+d.id),{bn,en,pdf,updatedAt:ts()});aud(b,"PAGE_EDITED",d.id,"",String(bn.length+en.length));
 try{await b.commit()}catch(e){throw new Error(e.code==="permission-denied"?"Not allowed (Firestore rules — deploy the new rules)":e.message)}
 PG[d.id]={bn,en,pdf};applyPages();return{ok:true}};
H.reverseExpense=async d=>{adm();const reason=String(d.reason||"").trim().slice(0,300);need(d.id&&reason.length>=3,"Expense and reason (min 3 chars) required");
 const es=await gd("expenses/"+d.id);need(es.exists(),"Expense not found");const e=es.data();need(!e.reversed,"Already reversed");
 const tid="TRX-EXP-"+d.id,rid="REV-"+tid,tr=await gd("transactions/"+tid);need(tr.exists()&&tr.data().type==="expense","Original expense entry missing");need(!(await gd("transactions/"+rid)).exists(),"Already reversed");
 const amt=e.amount,b=writeBatch(db);
 tx(b,rid,{memberId:"ORG",type:"expenseReversal",amount:amt,personalShare:0,commonShare:amt,reverses:tid,description:"Expense reversal: "+reason});
 b.set(D("commonFund/main"),{fundId:"main",totalExpense:increment(-amt),currentBalance:increment(amt),updatedAt:ts()},{merge:true});
 b.update(D("expenses/"+d.id),{reversed:true,reversedBy:uid(),reverseReason:reason});
 aud(b,"EXPENSE_REVERSED",d.id,String(amt),"reversed",reason);
 try{await b.commit()}catch(e2){throw new Error(e2.code==="permission-denied"?"Not allowed (Firestore rules — deploy the new rules)":e2.message)}return{ok:true}};
H.setLoanDue=async d=>{staff();need(/^\d{4}-\d{2}-\d{2}$/.test(d.due||""),"Date must be YYYY-MM-DD");const s=await gd("loans/"+d.id);need(s.exists()&&s.data().status==="disbursed","Loan not active");
 const b=writeBatch(db);b.update(D("loans/"+d.id),{dueDate:d.due});aud(b,"LOAN_DUE_SET",d.id,s.data().dueDate||"",d.due);
 try{await b.commit()}catch(e){throw new Error(e.code==="permission-denied"?"Not allowed (Firestore rules — deploy the new rules)":e.message)}return{ok:true}};
H.editMember=async d=>{adm();const id=String(d.id||"");need(/^SA-\d{3}$/.test(id),"Bad member id");const ms=await gd("members/"+id);need(ms.exists(),"Member not found");
 const nameEn=String(d.nameEn||"").trim(),nameBn=String(d.nameBn||"").trim()||nameEn,bk=String(d.bkash||"").trim(),vi=String(d.village||"").trim();
 const ph=String(d.phone||"").replace(/[০-৯]/g,c=>"০১২৩৪৫৬৭৮৯".indexOf(c)).replace(/[\s-]/g,"").replace(/^\+?880/,"0");
 need(nameEn.length>=2&&nameEn.length<=80&&nameBn.length<=80,"Name required (2-80 chars)");
 need(ph===""||/^01[3-9]\d{8}$/.test(ph),"Phone must be 01XXXXXXXXX");need(bk===""||/^01[3-9]\d{8}$/.test(bk),"bKash must be 01XXXXXXXXX");need(vi.length<=120,"Address too long");
 const b=writeBatch(db);b.update(D("members/"+id),{nameEn,nameBn});
 b.set(D("members/"+id+"/private/profile"),{phone:ph},{merge:true});b.set(D("members/"+id+"/private/application"),{bkash:bk,village:vi},{merge:true});
 aud(b,"MEMBER_EDITED",id,ms.data().nameEn||"",nameEn);
 try{await b.commit()}catch(e){throw new Error(e.code==="permission-denied"?"Not allowed (Firestore rules)":e.message)}return{ok:true}};
H.setMemberActive=async d=>{adm();const id=String(d.id||""),on=!!d.active;need(/^SA-\d{3}$/.test(id),"Bad member id");need(id!==me().memberId,"You cannot deactivate your own account");
 const us=await getDocs(query(collection(db,"users"),where("memberId","==",id)));need(!us.empty,"No login account found for this member");
 const b=writeBatch(db);us.forEach(u=>b.update(u.ref,{status:on?"active":"inactive"}));b.update(D("members/"+id),{status:on?"active":"inactive"});
 aud(b,on?"MEMBER_ACTIVATED":"MEMBER_DEACTIVATED",id,on?"inactive":"active",on?"active":"inactive");
 try{await b.commit()}catch(e){throw new Error(e.code==="permission-denied"?"Not allowed (Firestore rules)":e.message)}return{ok:true}};
H.recordDisbursement=async d=>{staff();const p=(await SA.rows("proposals")).find(x=>x.id===d.id);need(p&&p.kind==="support"&&p.status==="approved","Not approved by vote");
 need(p.subjectMemberId!==me().memberId,"You cannot disburse your own support");
 const ln=p.supportType==="loan",lid=(ln?"LOAN-":"DON-")+p.id,col=ln?"loans":"donations";need(!(await gd(col+"/"+lid)).exists(),"Already disbursed");
 const f=await gd("commonFund/main");need((f.exists()?f.data().currentBalance||0:0)>=p.amount,"Not enough common fund");const b=writeBatch(db);
 b.set(D(col+"/"+lid),{id:lid,memberId:p.subjectMemberId,type:p.supportType,amount:p.amount,purpose:p.purpose,proposalId:p.id,status:"disbursed",disbursedBy:uid(),...(ln?{outstanding:p.amount,repaid:0,repayments:0,...(/^\d{4}-\d{2}-\d{2}$/.test(d.due||"")?{dueDate:d.due}:{})}:{}),createdAt:ts()});
 tx(b,"TRX-DISB-"+lid,{memberId:p.subjectMemberId,type:ln?"loanDisbursement":"donation",amount:-p.amount,personalShare:0,commonShare:-p.amount,description:p.purpose});
 post(b,p.subjectMemberId,0,-p.amount,ln?"loan":"donation");aud(b,"SUPPORT_DISBURSED",lid,"approved","disbursed");await b.commit();return{ok:true}};
H.recordRepayment=async d=>{staff();const s=await gd("loans/"+d.loanId);need(s.exists()&&s.data().status==="disbursed","Loan not active");const l=s.data(),a=d.amount;
 need(l.memberId!==me().memberId,"You cannot record your own repayment");need(Number.isInteger(a)&&a>0&&a<=l.outstanding,"Bad amount (more than outstanding?)");
 const n=l.repayments+1,left=l.outstanding-a,b=writeBatch(db);
 b.update(D("loans/"+d.loanId),{outstanding:left,repaid:l.repaid+a,repayments:n,status:left===0?"repaid":"disbursed"});
 tx(b,"TRX-REP-"+d.loanId+"-"+n,{memberId:l.memberId,type:"loanRepayment",amount:a,personalShare:0,commonShare:a,description:"Repayment "+d.loanId});
 post(b,l.memberId,0,a,"repay");aud(b,"LOAN_REPAYMENT",d.loanId,String(l.outstanding),String(left));await b.commit();return{ok:true}};
H.saveMeeting=async d=>{staff();const isNew=!d.id,ref=isNew?doc(collection(db,"meetings")):D("meetings/"+d.id),x={};
 if(isNew||d.date){need(/^\d{4}-\d{2}-\d{2}$/.test(d.date||""),"Bad date");x.date=d.date}
 if(isNew||d.title){const t=String(d.title||"").trim();need(t.length>=3,"Bad title");x.title=t.slice(0,150)}
 if(d.agenda!==undefined)x.agenda=String(d.agenda).slice(0,1000);if(d.minutes!==undefined)x.minutes=String(d.minutes).slice(0,4000);
 const b=writeBatch(db);b.set(ref,{...x,id:ref.id,updatedAt:ts(),...(isNew?{createdAt:ts()}:{})},{merge:true});
 if(isNew)notice(b,"সভার নোটিশ / Meeting notice",x.date+" — "+x.title);aud(b,isNew?"MEETING_CREATED":"MEETING_UPDATED",ref.id);await b.commit();return{id:ref.id}};

 if(d.action==="reject"){b.update(D("applications/"+d.id),{status:"rejected",reviewedBy:uid()});aud(b,"APPLICATION_REJECTED",d.id,"pending","rejected")}

 await b.commit();return{ok:true}};

 const raw=crypto.getRandomValues(new Uint8Array(9)),temp=btoa(String.fromCharCode(...raw)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");

 await signOut(a2).catch(()=>{});await deleteApp(aux);
 const ms=await rows0("members"),cn=await gd("counters/members"),next=cn.exists()?cn.data().next:ms.reduce((m,x)=>Math.max(m,parseInt(x.id.split("-")[1],10)||0),0)+1,id="SA-"+String(next).padStart(3,"0"),b=writeBatch(db);
 b.set(D("users/"+nu),{uid:nu,memberId:id,email,role,status:"active",language:"bn",createdAt:ts()});
 b.set(D("members/"+id),{memberId:id,nameBn,nameEn,joiningDate:new Date().toISOString().slice(0,10),memberType:app?"member":"founder",status:"active"});
 b.set(D("counters/members"),{next:next+1});

 aud(b,"MEMBER_CREATED",id,"",role);await b.commit();return{memberId:id,email,tempPassword:temp,count:ms.filter(m=>m.status==="active").length+1}};
