<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Admin Setup — Sixfold Alliance</title>
<style>
body{margin:0;background:#101815;color:#e8efe9;font:16px/1.6 "Hind Siliguri",system-ui,sans-serif;padding:20px 14px 60px}
main{max-width:460px;margin:auto}h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 8px;color:#e0b252}
.card{background:#18231f;border:1px solid #2a3a34;border-radius:14px;padding:16px;margin:14px 0}
label{font-size:14px;color:#9aa9a2}input,select{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 12px;border:1px solid #2a3a34;border-radius:10px;background:#101815;color:#e8efe9;font:inherit}
button{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;background:#3fc4a0;color:#06251c;cursor:pointer}
button.o{background:transparent;border:1.5px solid #9aa9a2;color:#e8efe9}.ok{color:#3fc4a0}.err{color:#ff8a7a}
pre{white-space:pre-wrap;background:#101815;border-radius:10px;padding:10px;margin:8px 0 0;user-select:all}
.note{font-size:13px;color:#9aa9a2;border-left:3px solid #e0b252;padding-left:10px}
</style></head><body><main>
<h1>Admin Setup</h1><p class="note">শুধু বিদ্যমান Admin ঢুকতে পারবে। কাজ শেষে এই ফাইলটা Vercel থেকে মুছে ফেলো।</p>
<div class="card" id="step1"><h2>Admin Login</h2>
<label>Email</label><input id="le" type="email" autocomplete="username">
<label>Password</label><input id="lp" type="password" autocomplete="current-password">
<button id="li">Login</button><p id="lm" class="err"></p></div>
<div id="step2" style="display:none"><p id="who"></p>
<div class="card"><h2>নতুন Admin তৈরি</h2><p class="note">আলাদা ইমেইল লাগবে (সদস্যের ইমেইল নয়)। এই account সদস্য তালিকায় আসবে না।</p>
<label>নতুন Admin-এর ইমেইল</label><input id="ae" type="email"><button id="ca">তৈরি করো</button><p id="am"></p><pre id="ar"></pre></div>
<div class="card"><h2>ভূমিকা বদলান</h2><p class="note">যেমন Hridoy-কে Admin থেকে শুধু সদস্য করা।</p>
<label>সদস্যের ইমেইল</label><input id="re" type="email"><label>নতুন ভূমিকা</label>
<select id="rr"><option value="member">Member</option><option value="treasurer">Treasurer</option></select>
<button id="cr">বদলাও</button><p id="rm"></p></div>
<button class="o" id="lo">Logout</button></div>
</main>
<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,deleteUser}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,collection,query,where,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import{getFunctions,httpsCallable}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";
const cfg={apiKey:"AIzaSyDHl6SNaZ7pLoLG-_MZtn3oZasCJMDm0vM",authDomain:"sixfold-alliance.firebaseapp.com",projectId:"sixfold-alliance",storageBucket:"sixfold-alliance.firebasestorage.app",appId:"1:282472030323:web:7c79acb25942e3780cca06"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),fn=getFunctions(app,"asia-south1");
const $=id=>document.getElementById(id),EM=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const say=(id,m,ok)=>{const e=$(id);e.textContent=m;e.className=ok?"ok":"err"};
const msgOf=e=>(e&&e.message||String(e)).replace(/^Firebase:\s*/,"");
const tempPw=()=>{const a=crypto.getRandomValues(new Uint8Array(9));return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const noFn=e=>e&&(e.code==="functions/not-found"||e.code==="functions/unavailable");
// ১) শুধু বিদ্যমান Admin ঢুকতে পারবে
async function login(email,pw){
  const u=(await signInWithEmailAndPassword(auth,email,pw)).user;
  const s=await getDoc(doc(db,"users",u.uid)).catch(()=>null);
  if(!s||!s.exists()||s.data().role!=="admin"||s.data().status!=="active"){await signOut(auth);throw new Error("এই account Admin নয়")}
  return u}
// ২) নতুন Admin: Functions থাকলে সেটা, না থাকলে (Lite) rules দিয়ে সরাসরি
async function createAdmin(email){
  email=String(email||"").trim().toLowerCase();if(!EM.test(email))throw new Error("ইমেইল ঠিক নয়");
  try{const r=await httpsCallable(fn,"createAdminAccount")({email});return r.data}catch(e){if(!noFn(e))throw e}
  if(!(await getDocs(query(collection(db,"users"),where("email","==",email)))).empty)throw new Error("এই ইমেইলে আগেই account আছে");
  const pw=tempPw(),aux=initializeApp(cfg,"aux"+Date.now()),a2=getAuth(aux);let nu;
  try{nu=(await createUserWithEmailAndPassword(a2,email,pw)).user}catch(e){await deleteApp(aux);throw new Error(e.code==="auth/email-already-in-use"?"এই ইমেইলে Auth account আগেই আছে":msgOf(e))}
  try{await setDoc(doc(db,"users",nu.uid),{uid:nu.uid,memberId:"ADMIN",email,role:"admin",status:"active",language:"bn",createdAt:serverTimestamp()})}
  catch(e){await deleteUser(nu).catch(()=>{});await deleteApp(aux);throw new Error("লেখা যায়নি — Functions সংস্করণে হলে Functions deploy (বা Cloud Shell) লাগবে। "+msgOf(e))}
  await signOut(a2).catch(()=>{});await deleteApp(aux);return{email,tempPassword:pw}}
// ৩) ভূমিকা বদল
async function setRole(email,role){
  email=String(email||"").trim().toLowerCase();if(!["member","treasurer"].includes(role))throw new Error("ভূমিকা ঠিক নয়");
  try{const r=await httpsCallable(fn,"setMemberRole")({email,role});return r.data}catch(e){if(!noFn(e))throw e}
  const q=await getDocs(query(collection(db,"users"),where("email","==",email)));if(q.empty)throw new Error("এই ইমেইলে কোনো user নেই");
  const d=q.docs[0].data(),id=q.docs[0].id;
  if(d.memberId==="ADMIN")throw new Error("এটা Admin account, সদস্য নয়");
  if(id===auth.currentUser.uid)throw new Error("নিজের ভূমিকা নিজে বদলানো যায় না");
  if(d.role==="admin"&&(await getDocs(query(collection(db,"users"),where("role","==","admin")))).size<2)throw new Error("শেষ Admin-কে নামানো যায় না");
  await updateDoc(doc(db,"users",id),{role});return{ok:true,memberId:d.memberId}}
// ---- পর্দা ----
$("li").addEventListener("click",async()=>{say("lm","");try{await login($("le").value.trim(),$("lp").value);$("step1").style.display="none";$("step2").style.display="";say("who","✓ Admin হিসেবে ঢুকেছ: "+auth.currentUser.email,true)}catch(e){say("lm",msgOf(e))}});
$("ca").addEventListener("click",async()=>{say("am","…");$("ar").textContent="";try{const r=await createAdmin($("ae").value);say("am","✓ Admin তৈরি হয়েছে",true);$("ar").textContent="Email: "+r.email+"\nঅস্থায়ী পাসওয়ার্ড: "+r.tempPassword+"\n(একবারই দেখাচ্ছে, এখনই কপি করো)"}catch(e){say("am",msgOf(e))}});
$("cr").addEventListener("click",async()=>{say("rm","…");try{const r=await setRole($("re").value,$("rr").value);say("rm","✓ ভূমিকা বদলেছে ("+r.memberId+"). তাকে Logout করে আবার Login করতে বলো",true)}catch(e){say("rm",msgOf(e))}});
$("lo").addEventListener("click",async()=>{await signOut(auth);location.reload()});
</script></body></html>
