<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixfold Alliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1d2a26;--mu:#64706b;--ac:#0f6b57;--ac2:#c8932b;--bd:#e4ded0;--nav:#0f3d33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101815;--card:#18231f;--tx:#e8efe9;--mu:#9aa9a2;--ac:#3fc4a0;--ac2:#e0b252;--bd:#2a3a34;--nav:#0a1411}}
:root[data-theme="dark"]{--bg:#101815;--card:#18231f;--tx:#e8efe9;--mu:#9aa9a2;--ac:#3fc4a0;--ac2:#e0b252;--bd:#2a3a34;--nav:#0a1411}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
header{background:var(--nav);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
.bar{max-width:1000px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.5px;color:#fff;text-decoration:none;font-size:18px}.logo span{color:var(--ac2)}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}nav a{color:#cfe0d9;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px}
nav a.on,nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;text-decoration:none;display:inline-block}
.btn.o{background:transparent;border:1.5px solid currentColor}.btn.s{padding:5px 12px;font-size:13px}
.btn.g{background:var(--ac2);color:#241a05}
main{max-width:1000px;margin:auto;padding:20px 16px 50px}
.view{display:none}.view.on{display:block}
.hero{background:linear-gradient(135deg,var(--nav),#17614f);color:#fff;border-radius:18px;padding:48px 22px;text-align:center}
.hero h1{margin:0;font-size:clamp(30px,7vw,52px);letter-spacing:1px}.hero p{margin:8px 0}.hero .tag{color:var(--ac2);font-size:19px;font-weight:600}
.hero .acts{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:18px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat{text-align:center}.stat b{display:block;font-size:28px;color:var(--ac)}.stat small,.mu{color:var(--mu)}
h2{margin:26px 0 10px;font-size:24px}h2::after{content:"";display:block;width:44px;height:3px;background:var(--ac2);margin-top:4px;border-radius:2px}
.av{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;margin:0 auto 8px}
.mem{text-align:center}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-size:14px;color:var(--mu)}.narrow{max-width:400px;margin:20px auto}
.note{background:rgba(200,147,43,.15);border-left:4px solid var(--ac2);padding:10px 12px;border-radius:8px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.pill{color:var(--ac);font-weight:600}
@media print{header,.tabs,.btn,footer,select,label{display:none!important}body{background:#fff;color:#000}body::before{display:none}.card{border:0}}
footer{text-align:center;color:var(--mu);font-size:13px;padding:20px}
ul.cl li{margin:6px 0}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#home">SIXFOLD <span>ALLIANCE</span></a>
<nav id="nav">
<a href="#home" data-i="nHome"></a><a href="#about" data-i="nAbout"></a><a href="#activities" data-i="nAct"></a><a href="#constitution" data-i="nCons"></a><a href="#contact" data-i="nCont"></a>
</nav>
<button class="btn o s" id="lang" style="color:#fff">EN</button>
<a class="btn g s" href="#login" data-i="login"></a>
</div></header>
<main>

<section class="view" id="v-home">
<div class="hero"><h1>SIXFOLD ALLIANCE</h1><p class="tag">Six Friends. One Bond.</p>
<p data-i="motto"></p>
<div class="acts"><a class="btn g" href="#about" data-i="explore"></a><a class="btn o" href="#login" style="color:#fff" data-i="mlogin"></a></div></div>
<h2 data-i="nAbout"></h2><p data-i="aboutS"></p>
</section>

<section class="view" id="v-about">
<h2 data-i="nAbout"></h2>
<div class="card"><h3 data-i="mission"></h3><p data-i="missionT"></p></div><br>
<div class="card"><h3 data-i="vision"></h3><p data-i="visionT"></p></div><br>
<div class="card"><h3 data-i="obj"></h3><ul class="cl"><li data-i="o1"></li><li data-i="o2"></li><li data-i="o3"></li></ul></div>
</section>


<section class="view" id="v-activities">
<h2 data-i="nAct"></h2>
<div class="grid">
<div class="card"><h3 data-i="a1"></h3><p class="mu" data-i="a1t"></p></div>
<div class="card"><h3 data-i="a2"></h3><p class="mu" data-i="a2t"></p></div>
<div class="card"><h3 data-i="a3"></h3><p class="mu" data-i="a3t"></p></div>
</div>
</section>


<section class="view" id="v-constitution">
<h2 data-i="nCons"></h2>
<div class="card"><h3 data-i="rules"></h3>
<div class="wrap"><table><tr><th data-i="dec"></th><th data-i="req"></th></tr>
<tr><td data-i="d1"></td><td>৫ / ৬</td></tr>
<tr><td data-i="d2"></td><td>৬ / ৬</td></tr>
<tr><td data-i="d3"></td><td>৬ / ৬</td></tr>
<tr><td data-i="d4"></td><td>৬ / ৬</td></tr>
<tr><td data-i="d5"></td><td>৪ / ৫</td></tr></table></div></div>
</section>

<section class="view" id="v-contact">
<h2 data-i="nCont"></h2>
<div class="card narrow" style="margin-top:0">
<label data-i="name"></label><input id="cn">
<label>Email</label><input id="ce" type="email">
<label data-i="msg"></label><textarea id="cm" rows="4"></textarea>
<button class="btn" id="send" data-i="send"></button>
<p class="pill" id="sent"></p></div>
</section>

<section class="view" id="v-login">
<div class="tabs" style="justify-content:center"><button class="btn s" id="tL" data-i="login"></button><button class="btn o s" id="tA" style="color:var(--ac)" data-i="apply"></button></div>
<div class="card narrow" id="cLogin"><h2 data-i="login" style="margin-top:0"></h2>
<label data-i="em"></label><input id="le" type="email" placeholder="member@example.com">
<label data-i="pass"></label><input id="lp" type="password">
<button class="btn" id="go" style="width:100%" data-i="login"></button>
<p class="pill" id="lerr"></p><p><a href="#login" id="fp" data-i="forgot"></a></p>
<p class="note" data-i="loginN"></p></div>
<div class="card narrow" id="cApply" style="display:none"><h2 data-i="apply" style="margin-top:0"></h2>
<label data-i="fn"></label><input id="ap_fn" maxlength="60" autocomplete="given-name">
<label data-i="ln"></label><input id="ap_ln" maxlength="60" autocomplete="family-name">
<label data-i="fa"></label><input id="ap_fa" maxlength="60">
<label data-i="mo"></label><input id="ap_mo" maxlength="60">
<label data-i="vi"></label><input id="ap_vi" maxlength="80">
<label data-i="ph"></label><input id="ap_ph" type="tel" maxlength="20" placeholder="01XXXXXXXXX" autocomplete="tel">
<label data-i="em"></label><input id="ap_em" type="email" maxlength="120" autocomplete="email">
<label data-i="bk"></label><input id="ap_bk" type="tel" maxlength="20" placeholder="01XXXXXXXXX">
<div style="position:absolute;left:-9999px" aria-hidden="true"><input id="ap_hp" tabindex="-1" autocomplete="off"></div>
<button class="btn" id="apgo" style="width:100%" data-i="submitApp"></button>
<p class="pill" id="apmsg"></p><p class="note" data-i="apNote"></p></div>
</section>

<section class="view" id="v-portal"></section>
<section class="view" id="v-admin"></section>

</main>
<footer>© Sixfold Alliance · Six Friends. One Bond.</footer>
